[project]
name = "opencvcursorproy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "WaffleAtomico", email = "penillaskakievichoscar@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.2.1",
    "mediapipe==0.10.9",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pyautogui>=0.9.54",
    "sounddevice>=0.5.6",
]

[project.scripts]
opencvcursorproy = "opencvcursorproy:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
